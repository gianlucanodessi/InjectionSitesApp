name: InSofina
options:
  developmentLanguage: it
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.example.insofina.ios
    MARKETING_VERSION: '2.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  InSofina:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: InSofina
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.insofina.backup
            UTTypeDescription: Backup InSofina
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [insofia-backup]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Backup InSofina
            LSHandlerRank: Owner
            LSItemContentTypes: [com.example.insofina.backup]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  InSofinaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        excludes: [README.md]
        buildPhase: resources
    dependencies:
      - target: InSofina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.insofina.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  InSofinaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InSofina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.insofina.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InSofina:
    build:
      targets:
        InSofina: all
    test:
      gatherCoverageData: true
      targets: [InSofinaTests, InSofinaUITests]
