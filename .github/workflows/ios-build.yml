name: Build and test iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [ios-implementation]
    paths: ['InjectionSitesIOS/**', '.github/workflows/ios-build.yml', 'InjectionSitesAndroid_v2/app/src/main/**']
  pull_request:
    paths: ['InjectionSitesIOS/**', '.github/workflows/ios-build.yml', 'InjectionSitesAndroid_v2/app/src/main/**']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare logs
        run: mkdir -p InjectionSitesIOS/build
      - name: Verify original assets and coordinates
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-verify"
          "$RUNNER_TEMP/ios-verify/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/ios-verify/bin/python" InjectionSitesIOS/scripts/verify_port.py
      - name: Generate fixture with original Android BackupManager
        shell: bash
        run: |
          set -o pipefail
          python3 InjectionSitesIOS/scripts/prepare_interop.py
          bash InjectionSitesAndroid_v2/gradlew -p "$PWD/InjectionSitesIOS/Interop" run --args="generate $PWD/InjectionSitesIOS/Tests/Fixtures/android.insofia-backup" 2>&1 | tee InjectionSitesIOS/build/android-fixture.log
      - name: Install pinned XcodeGen and generate project
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch 2.42.0 https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/XcodeGen"
          swift build --package-path "$RUNNER_TEMP/XcodeGen" -c release --product xcodegen 2>&1 | tee InjectionSitesIOS/build/xcodegen-install.log
          "$RUNNER_TEMP/XcodeGen/.build/release/xcodegen" generate --spec InjectionSitesIOS/project.yml 2>&1 | tee InjectionSitesIOS/build/xcodegen.log
      - name: Select iPhone Simulator
        shell: bash
        run: |
          xcodebuild -version | tee InjectionSitesIOS/build/xcode-version.log
          xcrun simctl list devices available -j > InjectionSitesIOS/build/simulators.json
          DEVICE=$(python3 -c 'import json; d=json.load(open("InjectionSitesIOS/build/simulators.json")); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["isAvailable"] and "iPhone" in x["name"]))')
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build and run all tests without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project InjectionSitesIOS/InSofina.xcodeproj -scheme InSofina -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath InjectionSitesIOS/build/DerivedData -resultBundlePath InjectionSitesIOS/build/InSofina.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build test 2>&1 | tee InjectionSitesIOS/build/xcodebuild.log
      - name: Verify Swift export with original Android BackupManager
        shell: bash
        run: |
          set -o pipefail
          CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_UDID" com.example.insofina.ios data)
          cp "$CONTAINER/Documents/ios-export.insofia-backup" InjectionSitesIOS/build/ios-export.insofia-backup
          bash InjectionSitesAndroid_v2/gradlew -p "$PWD/InjectionSitesIOS/Interop" run --args="verify $PWD/InjectionSitesIOS/build/ios-export.insofia-backup" 2>&1 | tee InjectionSitesIOS/build/android-read-swift.log
      - name: Upload results and useful logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          retention-days: 14
          path: |
            InjectionSitesIOS/build/*.log
            InjectionSitesIOS/build/*.json
            InjectionSitesIOS/build/*.insofia-backup
            InjectionSitesIOS/build/InSofina.xcresult
            InjectionSitesIOS/Tests/Fixtures/*.insofia-backup
