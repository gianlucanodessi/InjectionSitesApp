name: Build Android Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing required GitHub Actions secret ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          if ! printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::The restored debug keystore is empty."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        working-directory: InjectionSitesAndroid_v2
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: InjectionSitesAndroid_v2
        run: ./gradlew :app:assembleDebug

      - name: Remove restored debug signing key
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: InjectionSitesAndroid_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
